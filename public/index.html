<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optimized Website</title>

  <!-- MINIFIED CSS (style.min.css is the small version of style.css) -->
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>
  <h1>Photo Gallery</h1>
  <p>Scroll down. Images load only when you reach them.</p>

  <!-- LAZY LOADING: loading="lazy" tells the browser to load the image later.
       width and height stop the page from jumping while loading. -->
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Nature 1" loading="lazy">
<img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Nature 2" loading="lazy">
<img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Nature 3" loading="lazy">
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Nature 4" loading="lazy">

  <button id="btn">Click me</button>
  <p id="msg"></p>

  <!-- MINIFIED JS; defer lets the page load first -->
  <script src="js/script.min.js" defer></script>
</body>
</html>
